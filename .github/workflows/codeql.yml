name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 6am UTC

# Nothing by default; the analyze job asks for what CodeQL needs.
permissions: {}

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: windows-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The gitignored credential partial classes are required to compile QuickMail.csproj.
      # CodeQL analyses the code, not the values, so they are empty placeholders: this runs
      # on pull requests from any branch and must never see a secret.
      - name: Write placeholder credential partials
        shell: pwsh
        run: ./scripts/write-credential-partials.ps1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: Build
        run: dotnet build QuickMail/QuickMail.csproj -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
