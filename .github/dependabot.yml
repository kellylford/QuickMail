version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    reviewers:
      - kellylford
    assignees:
      - kellylford
    groups:
      microsoft-identity:
        patterns:
          - "Microsoft.Identity.*"
      microsoft-data:
        patterns:
          - "Microsoft.Data.*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    reviewers:
      - kellylford
    assignees:
      - kellylford

  # relay/package.json, the bug-report Worker. It has no dependencies on
  # purpose (wrangler cannot install on Windows ARM64, so CI runs it through
  # npx), so today this finds nothing. It is here so that anything added
  # later is watched from the day it lands, grouped into one PR.
  - package-ecosystem: npm
    directory: "/relay"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    groups:
      relay:
        patterns:
          - "*"
