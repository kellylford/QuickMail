# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
# Installer manifest. See README.md in this folder for why each choice is what it is.
PackageIdentifier: KellyLford.QuickMail
PackageVersion: <VERSION>
# The release MSI -- the same file the download page offers. Velopack builds it with WiX.
# Not Setup.exe: run over an existing MSI install, Setup.exe leaves two Add/Remove Programs
# rows and removing the stale one deletes the working install (#536, Phase 1c of the plan).
# Every existing user installed from the MSI, so the MSI is the only installer that meets
# their machines without that hazard.
InstallerType: wix
Scope: user
InstallModes:
- interactive
- silent
- silentWithProgress
# No InstallerSwitches: winget passes /quiet (or /passive) and /norestart to an MSI itself.
# Both are UI level < 5, which since vpk 1.2.158 sets the per-user default location --
# %LocalAppData%\QuickMail, the same as the wizard (measured on both architectures).
UpgradeBehavior: install
# QuickMail updates itself through Velopack and keeps the Add/Remove Programs version
# current as it does, so winget rarely has anything to upgrade. When it does (a copy that has
# not been run since the last release), a newer MSI over an older one is a Windows Installer
# major upgrade: it uninstalls the old copy first, and that uninstall fires QuickMail's
# "remove your data?" prompt mid-upgrade (#245; default keep, nothing is lost). Keeping the
# package out of an unattended `winget upgrade --all` means nobody meets that prompt from a
# command they did not aim at QuickMail. `winget upgrade quickmail` still works.
RequireExplicitUpgrade: true
ReleaseDate: <RELEASE-DATE>
# How winget recognises an installed copy. The MSI writes two Add/Remove Programs rows:
# a hidden per-version {ProductCode} row that Velopack's self-updates never touch (#244), and
# Velopack's visible HKCU\...\Uninstall\MSI:QuickMail, whose DisplayVersion self-updates DO
# keep current (measured: registration 0.8.44.0, row and exe 0.8.52). winget identifies that row as ARP\User\<arch>\MSI:QuickMail, i.e. its
# ProductCode is the key name. Correlate on it alone. Deliberately no UpgradeCode and no
# installer-level ProductCode: both lead winget to the Windows Installer registration, which
# reports the version originally installed, not the one running -- so `winget upgrade` would
# offer an upgrade that self-update applied long ago. wingetcreate adds both automatically;
# remove them (README, step 1).
AppsAndFeaturesEntries:
- DisplayName: QuickMail
  Publisher: Kelly Ford
  ProductCode: MSI:QuickMail
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/kellylford/QuickMail/releases/download/v<VERSION>/QuickMail-<VERSION>-win.msi
  InstallerSha256: <X64-SHA256>
- Architecture: arm64
  InstallerUrl: https://github.com/kellylford/QuickMail/releases/download/v<VERSION>/QuickMail-<VERSION>-win-arm64.msi
  InstallerSha256: <ARM64-SHA256>
ManifestType: installer
ManifestVersion: 1.10.0
